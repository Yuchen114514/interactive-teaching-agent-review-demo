[project]
name = "agno-agents-backend"
version = "0.1.0"
description = "Multi-agent FastAPI service powered by Agno"
authors = [{name = "OJ Platform", email = "dev@oj.local"}]
readme = "README.md"
requires-python = "~=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.21",
    "greenlet>=3.0.0",
    "psycopg[binary,pool]>=3.2.1",
    "pymysql>=1.1.0",
    "redis>=5.0.8",
    "httpx>=0.27.2",
    "openai>=1.0.0",
    "PyJWT>=2.9.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.1",
    "pydantic-settings>=2.5.2",
    "numpy>=2.0.1",
    "alembic>=1.13.2",
    "agno>=0.3.2"
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.0.1"
]
dev = [
    "ruff>=0.6.5",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.23.8"
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
